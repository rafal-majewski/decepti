services:
  decepti:
    build:
      args:
        DEBIAN__DOCKER_IMAGE__TAG__DATE: "20251208"
        DOCKER_GID: "${DOCKER_GID}"
        NODE_JS__VERSION: "25.9.0"
      context: "."
      dockerfile: "Dockerfile"
    env_file:
      - path: "./.env"
        required: true
    environment: {}
    volumes:
      - consistency: "consistent"
        read_only: false
        source: ".."
        target: "/home/developer/decepti"
        type: "bind"
      - consistency: "consistent"
        read_only: false
        source: "./.bashrc"
        target: "/home/developer/.bashrc"
        type: "bind"
      - consistency: "consistent"
        read_only: false
        source: "/var/run/docker.sock"
        target: "/var/run/docker.sock"
        type: "bind"
