env:
  ADAPTER__NAME: "Node"
  DEBIAN__DOCKER_IMAGE__TAG__DATE: "20251208"
  HOSTING__BASE_PATH: ""
  NODE_JS__VERSION: "25.9.0"
  SERVER__BIND__ADDRESS: "::1"
  SERVER__BIND__PORT__NUMBER: "5173"
  SERVER__BIND__PORT__TLS__IS_ENABLED: "no"
  WEB_PUSH__EMAIL: "mailto:ci@example.com"
  WEB_PUSH__PRIVATE_KEY: "ci-private-key"
  WEB_PUSH__PUBLIC_KEY: "ci-public-key"
jobs:
  commitlint_check:
    name: "commitlint check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0
      - name: "Setup Node.js"
        uses: "actions/setup-node@v6.3.0"
        with:
          cache: "npm"
          node-version: "${{env.NODE_JS__VERSION}}"
      - name: "Install the dependencies"
        run: |
          npm ci --registry=https://registry.npmjs.org --//registry.npmjs.org/:_authToken=${{secrets.NPM__REGISTRY__ACCESS_TOKEN}}
      - if: "${{github.event_name == 'pull_request'}}"
        name: "Configure Git"
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - if: "${{github.event_name == 'pull_request'}}"
        name: "Add a dummy commit with the pull request title as the commit message"
        run: |
          git commit --allow-empty --message "${{github.event.pull_request.title}}"
      - env:
          NODE_OPTIONS: "--import=@native-typescript/loader-of-typescript-for-node-js"
        name: "Run the commitlint check"
        run: |
          npm run commitlint:check:last
  eslint_check:
    name: "ESLint check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
      - name: "Setup Node.js"
        uses: "actions/setup-node@v6.3.0"
        with:
          cache: "npm"
          node-version: "${{env.NODE_JS__VERSION}}"
      - name: "Install the dependencies"
        run: |
          npm ci --registry=https://registry.npmjs.org --//registry.npmjs.org/:_authToken=${{secrets.NPM__REGISTRY__ACCESS_TOKEN}}
      - env:
          NODE_OPTIONS: "--import=@native-typescript/loader-of-typescript-for-node-js"
        name: "Run the ESLint check"
        run: |
          npm run eslint:check
  prettier_check:
    name: "Prettier check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
      - name: "Setup Node.js"
        uses: "actions/setup-node@v6.3.0"
        with:
          cache: "npm"
          node-version: "${{env.NODE_JS__VERSION}}"
      - name: "Install the dependencies"
        run: |
          npm ci --registry=https://registry.npmjs.org --//registry.npmjs.org/:_authToken=${{secrets.NPM__REGISTRY__ACCESS_TOKEN}}
      - env:
          NODE_OPTIONS: "--import=@native-typescript/loader-of-typescript-for-node-js"
        name: "Run the Prettier check"
        run: |
          npm run prettier:check
  stylelint_check:
    name: "Stylelint check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
      - name: "Setup Node.js"
        uses: "actions/setup-node@v6.3.0"
        with:
          cache: "npm"
          node-version: "${{env.NODE_JS__VERSION}}"
      - name: "Install the dependencies"
        run: |
          npm ci --registry=https://registry.npmjs.org --//registry.npmjs.org/:_authToken=${{secrets.NPM__REGISTRY__ACCESS_TOKEN}}
      - env:
          NODE_OPTIONS: "--import=@native-typescript/loader-of-typescript-for-node-js"
        name: "Run the Stylelint check"
        run: |
          npm run stylelint:check
  sveltekit_check:
    name: "SvelteKit check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
      - name: "Setup Node.js"
        uses: "actions/setup-node@v6.3.0"
        with:
          cache: "npm"
          node-version: "${{env.NODE_JS__VERSION}}"
      - name: "Install the dependencies"
        run: |
          npm ci --registry=https://registry.npmjs.org --//registry.npmjs.org/:_authToken=${{secrets.NPM__REGISTRY__ACCESS_TOKEN}}
      - env:
          NODE_OPTIONS: "--import=@native-typescript/loader-of-typescript-for-node-js"
        name: "Run the SvelteKit check"
        run: |
          npm run sveltekit:check
  test_check:
    name: "Test check"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
      - name: "Setup Node.js"
        uses: "actions/setup-node@v6.3.0"
        with:
          cache: "npm"
          node-version: "${{env.NODE_JS__VERSION}}"
      - name: "Install the dependencies"
        run: |
          npm ci --registry=https://registry.npmjs.org --//registry.npmjs.org/:_authToken=${{secrets.NPM__REGISTRY__ACCESS_TOKEN}}
      - env:
          NODE_OPTIONS: "--import=@native-typescript/loader-of-typescript-for-node-js"
        name: "Install Playwright browsers"
        run: |
          npx playwright install
      - env:
          NODE_OPTIONS: "--import=@native-typescript/loader-of-typescript-for-node-js"
        name: "Run the test check"
        run: |
          npm run test:check
name: "Continuous integration"
on:
  pull_request:
    types:
      - "edited"
      - "opened"
      - "reopened"
      - "synchronize"
  push:
